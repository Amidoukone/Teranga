<script>
  'use strict';
  const $ = (selector) => document.querySelector(selector);
  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const actors = { client:{name:'Aminata Koné',initials:'AK'},agent:{name:'Awa Diarra',initials:'AD'},admin:{name:'Moussa Traoré',initials:'MT'},provider:{name:'Idrissa Coulibaly',initials:'IC'} };
  const seed = () => [
    {key:'service:1047',kind:'service',ref:'SRV-1047',title:'Visite de la maison',category:'Inspection',location:'Bamako · Badalabougou',state:'completed',agent:'Awa Diarra',owner:'Moussa Traoré',steps:[],report:'La visite est terminée. Les fenêtres, portes et installations ont été vérifiées. Aucun dégât visible n’a été constaté.',proofs:[{id:'service-proof:1',name:'Facade-maison.jpg',use:'Résultat du service',kind:'photo'},{id:'service-proof:2',name:'Compte-rendu-visite.pdf',use:'Résultat du service',kind:'document'}],amount:'15 000 F CFA',events:['Résultat remis par Awa','Visite commencée','Awa a été affectée à la demande','Demande reçue']},
    {key:'service:1053',kind:'service',ref:'SRV-1053',title:'Réparer la fuite d’eau',category:'Entretien',location:'Bamako · ACI 2000',state:'in_progress',agent:'Awa Diarra',owner:'Moussa Traoré',steps:[{id:21,title:'Identifier l’origine de la fuite',state:'completed',proofs:['Photo-du-joint.jpg']},{id:22,title:'Remplacer le joint et vérifier',state:'in_progress',proofs:[]}],report:'',proofs:[],amount:'Montant à confirmer',events:['Diagnostic terminé par Awa','Intervention commencée','Demande reçue']},
    {key:'project:77',kind:'project',ref:'PRJ-77',title:'Suivi du chantier familial',category:'Construction',location:'Bamako · Sotuba',state:'in_progress',agent:'Awa Diarra',owner:'Moussa Traoré',steps:[{id:71,title:'Contrôle des fondations',state:'validated',proofs:['Rapport-fondations.pdf']},{id:72,title:'Contrôle des murs',state:'in_progress',proofs:[]}],report:'',proofs:[],amount:'Budget dans les détails',events:['Contrôle des murs en cours','Contrôle des fondations terminé','Projet reçu']},
    {key:'order:2068',kind:'order',ref:'CMD-2068',title:'Fournitures pour la maison',category:'Commande',location:'Bamako · Livraison à domicile',state:'processing',agent:'Awa Diarra',owner:'Moussa Traoré',steps:[],report:'',proofs:[],amount:'32 500 F CFA',events:['Préparation commencée','Commande reçue']},
    {key:'service:88',kind:'taxi',ref:'TAX-88',title:'Course vers l’aéroport',category:'Taxi',location:'Bamako → Aéroport Modibo Keïta',state:'in_progress',agent:'Idrissa Coulibaly',owner:'Moussa Traoré',steps:[],report:'',proofs:[],amount:'Tarif dans le dossier',events:['Course en cours','Départ confirmé avec le code','Chauffeur affecté']},
    {key:'property_task:311',kind:'property_task',ref:'INT-311',title:'Relever le compteur de la maison',category:'Intervention sur un bien',location:'Bamako · Maison familiale',state:'created',agent:'Awa Diarra',owner:'Moussa Traoré',steps:[],report:'',proofs:[],amount:'Aucun frais déclaré',events:['Intervention affectée à Awa','Intervention créée sur la maison familiale']}
  ];
  let cases = seed();
  let role = 'client', view = 'center', tab = 'action', selected = null, query = '', family = 'all', reportOpen = false, message = '', serial = 100;
  const drafts = new Map();
  const openSections = new Set();
  const organized = new Set();
  const canSee = (item) => role === 'provider' ? item.kind === 'taxi' : item.kind !== 'taxi' || role !== 'agent';
  function next(item) {
    const readonly = {label:'Suivre le dossier',reason:`${item.agent} réalise le travail. Vous n’avez rien à faire pour le moment.`,action:'follow',needed:false};
    if (item.kind === 'taxi') return role === 'provider'
      ? {label:'Ouvrir les outils de la course',reason:'La course est en cours. Les outils de transport restent dans ce dossier.',action:'transport',needed:true}
      : {...readonly,reason:'Idrissa réalise la course. Le départ a été confirmé.'};
    if (['validated','delivered'].includes(item.state)) return {...readonly,label:'Voir le dossier',reason:'Le travail est terminé. Les documents restent disponibles.'};
    if (item.kind === 'property_task') {
      if (role === 'agent' && item.state === 'created') return {label:'Commencer le relevé',reason:'L’intervention vous est affectée.',action:'start-task',needed:true};
      if (role === 'agent' && item.state === 'in_progress') return {label:'Terminer le relevé',reason:'Ajoutez les éléments utiles dans ce dossier.',action:'finish-task',needed:true};
      if (role === 'admin' && item.state === 'completed') return {label:'Contrôler l’intervention',reason:'Le relevé attend votre contrôle administratif.',action:'validate-task',needed:true};
      return {...readonly,reason:item.state === 'completed' ? 'Le relevé attend le contrôle du responsable.' : readonly.reason};
    }
    if (role === 'client' && item.state === 'completed') return {label:'Vérifier le résultat',reason:'Awa a remis le résultat. Consultez le compte rendu et les justificatifs avant de confirmer.',action:'review',needed:true};
    if (role === 'admin') {
      const completed = item.kind === 'service' && item.steps.find((step) => step.state === 'completed');
      if (completed) return {label:'Contrôler une étape',reason:'Une étape réalisée attend votre contrôle. La confirmation du résultat reste celle du client.',action:'steps',needed:true};
      if (item.steps.some((step) => step.assigned === false)) return {label:'Affecter une étape',reason:'Une étape attend un intervenant. Son affectation reste une action du responsable.',action:'steps',needed:true};
      return {...readonly,reason:item.state === 'completed' ? 'Le résultat a été remis. La confirmation appartient au client.' : 'Le travail avance. Vous pouvez consulter les étapes et le suivi.'};
    }
    if (role === 'agent' && item.state === 'in_progress') {
      const pending = item.steps.find((step) => step.assigned !== false && ['created','in_progress'].includes(step.state));
      if (pending) return {label:'Continuer la réalisation',reason:`Étape en cours : ${pending.title}.`,action:'steps',needed:true};
      return {label:item.report ? 'Remettre le résultat' : 'Préparer le compte rendu',reason:item.report ? 'Le compte rendu est enregistré. Vous pouvez remettre le résultat au client.' : 'Décrivez le résultat et joignez les justificatifs dans ce dossier.',action:item.report ? 'handover' : 'report',needed:true};
    }
    if (role === 'agent' && item.kind === 'order') return {label:'Continuer la préparation',reason:'La commande est en préparation. Consultez les articles et les outils d’expédition.',action:'order',needed:true};
    return {...readonly,reason:item.state === 'completed' ? 'En attente de la confirmation du client.' : readonly.reason};
  }
  const stateLabel = (item) => ({created:'À commencer',in_progress:'En cours',processing:'En préparation',completed:item.kind === 'property_task' ? 'À contrôler' : 'Résultat à vérifier',validated:'Terminé',delivered:'Livré'}[item.state] || item.state);
  const typeLabel = (item) => ({service:'Service',project:'Projet',order:'Commande',taxi:'Taxi',property_task:'Intervention'}[item.kind]);
  function nav() {
    const entries = [['center','▤','Centre des opérations'],['cases','▱',role === 'client' ? 'Mes demandes' : role === 'provider' ? 'Mes interventions' : 'Mes dossiers'],...(role === 'admin' ? [['manage','⊞','Gestion']] : [])];
    const markup = entries.map(([key,icon,label]) => `<button type="button" data-view="${key}" ${view === key || view === 'case' && key === 'cases' ? 'aria-current="page"' : ''}><span class="nav-icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('');
    $('#side-nav').innerHTML = markup;
    $('#mobile-nav').innerHTML = markup + '<button type="button" data-modal="account"><span class="nav-icon" aria-hidden="true">○</span><span>Compte</span></button>';
    $('#profile-name').textContent = actors[role].name; $('#avatar').textContent = actors[role].initials;
    $('#place').textContent = role === 'admin' ? 'Espace responsable' : role === 'agent' ? 'Espace agent' : role === 'provider' ? 'Espace prestataire' : 'Mon espace';
  }
  const fileMarkup = (file) => `<div class="file"><span class="file-icon" aria-hidden="true">${file.kind === 'photo' ? 'IMG' : 'DOC'}</span><div><div class="filename">${esc(file.name)}</div><div class="file-meta">${esc(file.use)}</div></div><button type="button" data-preview="${esc(file.name)}" aria-label="Voir ${esc(file.name)}">Voir</button></div>`;
  function card(item, follows = false) {
    const action = next(item);
    return `<article class="card queue-card" aria-label="${esc(item.title)}"><div><div class="row"><span class="eyebrow">${item.ref} · ${typeLabel(item)}</span><span class="pill ${action.needed ? 'warn' : item.state === 'validated' ? 'good' : ''}">${esc(stateLabel(item))}</span></div><h3><button type="button" class="article-link" data-open="${item.key}">${esc(item.title)}</button></h3><p class="muted small">${esc(item.location)} · ${esc(item.agent)}</p><p class="next">${action.needed && !follows ? '<span>Votre action</span> · ' : ''}${esc(action.reason)}</p>${item.steps.length ? `<p class="muted small">${item.steps.filter((step) => ['completed','validated'].includes(step.state)).length}/${item.steps.length} étapes réalisées · un seul dossier</p>` : ''}</div><button class="${action.needed && !follows ? 'primary' : ''}" type="button" data-open="${item.key}">${follows ? 'Ouvrir le dossier' : esc(action.label)}</button></article>`;
  }
  function queueBody() {
    const available = cases.filter(canSee), actionable = available.filter((item) => next(item).needed), following = available.filter((item) => !next(item).needed);
    let visible = view === 'cases' ? available : tab === 'action' ? actionable : following;
    visible = visible.filter((item) => `${item.ref} ${item.title}`.toLocaleLowerCase('fr').includes(query.toLocaleLowerCase('fr')) && (family === 'all' || item.kind === family));
    return `${view === 'center' ? `<nav class="tabs" aria-label="Vues du centre"><button type="button" data-tab="action" ${tab === 'action' ? 'aria-current="page"' : ''}>À faire <span class="counter">${actionable.length}</span></button><button type="button" data-tab="following" ${tab === 'following' ? 'aria-current="page"' : ''}>À suivre <span class="counter">${following.length}</span></button><button type="button" data-tab="info" ${tab === 'info' ? 'aria-current="page"' : ''}>Informations</button></nav>` : ''}${view === 'center' && tab === 'info' ? info() : `<div class="toolbar"><label class="sr" for="search">Rechercher un dossier</label><input id="search" type="search" placeholder="Rechercher un dossier ou une référence" value="${esc(query)}"><label class="sr" for="family">Type de demande</label><select id="family"><option value="all">Tous les types</option>${['service','project','order','property_task','taxi'].map((kind) => `<option value="${kind}" ${family === kind ? 'selected' : ''}>${typeLabel({kind})}</option>`).join('')}</select></div><div id="queue-items" class="queue">${visible.length ? visible.map((item) => card(item, view === 'center' && tab === 'following')).join('') : `<div class="empty"><h2>${query || family !== 'all' ? 'Aucun dossier correspondant' : 'Aucune action pour le moment'}</h2><p class="muted">${query || family !== 'all' ? 'Essayez une autre recherche ou un autre type.' : 'Vos dossiers et leurs documents restent accessibles dans la vue À suivre.'}</p></div>`}</div>`}`;
  }
  const readMessages = new Set();
  function info() {
    const items = cases.filter(canSee).slice(0,3);
    return `<p class="muted small" style="margin-bottom:16px">Les informations vous tiennent au courant. Les lire ne termine pas le travail.</p><div class="queue">${items.map((item) => `<article class="card info-card"><div class="row between"><span class="eyebrow">${item.ref}</span><span class="pill ${readMessages.has(item.key) ? '' : 'blue'}">${readMessages.has(item.key) ? 'Lu' : 'À lire'}</span></div><h3 style="margin-top:10px">${esc(item.events[0])}</h3><p class="muted small">${esc(item.title)}</p><div class="row"><button type="button" data-info-open="${item.key}">Ouvrir le dossier</button>${readMessages.has(item.key) ? '' : `<button class="text" type="button" data-read="${item.key}">Marquer comme lu</button>`}</div></article>`).join('')}</div>`;
  }
  function center() {
    return `<div class="page-head"><div><p class="eyebrow">24 octobre 2026 · ${esc(actors[role].name)}</p><h1>${view === 'cases' ? role === 'client' ? 'Mes demandes' : role === 'provider' ? 'Mes interventions' : 'Mes dossiers' : 'Centre des opérations'}</h1><p class="muted">${view === 'cases' ? 'Retrouvez chaque demande, son résultat et ses documents.' : role === 'client' ? 'Ce qui vous attend, et les demandes qui avancent.' : role === 'admin' ? 'Les dossiers à débloquer et le travail de votre équipe.' : 'Vos interventions et la prochaine action à réaliser.'}</p></div>${role === 'client' ? '<button class="primary" type="button" data-modal="new">+ Nouvelle demande</button>' : role === 'agent' || role === 'provider' ? '<button type="button" data-modal="availability">Ma disponibilité</button>' : ''}</div>${queueBody()}`;
  }
  function stepsMarkup(item) {
    if (!item.steps.length && !organized.has(item.key)) return '';
    return `<details class="card" id="steps" data-scope="${role}:${item.key}" ${openSections.has(`${role}:${item.key}`) || organized.has(item.key) || next(item).action === 'steps' ? 'open' : ''}><summary>Étapes de réalisation <span class="counter">${item.steps.length}</span></summary><div class="inside"><p class="muted small">${item.kind === 'project' ? 'Les phases du projet conservent leurs documents et leurs contrôles.' : 'Chaque étape garde son intervenant et ses justificatifs. Le résultat du service se remet séparément.'}</p>${item.steps.map((step,index) => `<article class="step"><div class="row between"><span class="eyebrow">${item.kind === 'project' ? 'Phase' : 'Étape'} ${index+1}</span><span class="pill ${step.state === 'completed' ? 'warn' : step.state === 'validated' ? 'good' : 'blue'}">${({created:'À commencer',in_progress:'En cours',completed:'Réalisée · à contrôler',validated:'Contrôlée'})[step.state]}</span></div><h3>${esc(step.title)}</h3><p class="small muted">${step.assigned === false ? 'À affecter par le responsable' : esc(item.agent)}</p>${step.proofs.map((name) => `<div class="step-proof">Justificatif d’étape · ${esc(name)} <button class="text" type="button" data-preview="${esc(name)}">Voir</button></div>`).join('')}<div class="row">${role === 'admin' && step.assigned === false ? `<button type="button" data-step-assign="${step.id}">Affecter à Awa</button>` : ''}${role === 'agent' && step.assigned !== false && ['created','in_progress'].includes(step.state) ? `<button type="button" data-step-action="${step.id}">${step.state === 'created' ? 'Commencer l’étape' : 'Terminer l’étape'}</button><button class="text" type="button" data-step-proof="${step.id}">Ajouter un justificatif d’étape</button>` : ''}${role === 'admin' && step.state === 'completed' && item.kind !== 'project' ? `<button type="button" data-step-action="${step.id}">Contrôler l’étape</button>` : ''}</div></article>`).join('')}${['client','admin'].includes(role) && item.kind === 'service' ? '<div class="step-form"><form id="step-form"><label class="field" for="step-title">Ajouter une étape utile<input id="step-title" name="title" required maxlength="120" placeholder="Ex. Vérifier la réparation"></label><button type="submit">Ajouter l’étape</button></form></div>' : ''}</div></details>`;
  }
  function resultMarkup(item) {
    if (!item.report && !item.proofs.length) return '';
    return `<section class="card result" id="result" aria-labelledby="result-title"><div class="section-title"><h2 id="result-title">${item.kind === 'property_task' ? 'Justificatifs de l’intervention' : item.state === 'in_progress' ? 'Compte rendu enregistré' : 'Résultat remis'}</h2><span class="pill good">${item.proofs.length} pièce${item.proofs.length === 1 ? '' : 's'}</span></div><p class="small muted">${esc(item.agent)} · ${item.state === 'in_progress' ? 'Pas encore remis au client' : 'Compte rendu de réalisation'}</p>${item.report ? `<p class="report-text">${esc(item.report)}</p>` : ''}<div class="files">${item.proofs.map(fileMarkup).join('')}</div></section>`;
  }
  function reportForm(item) {
    if (!reportOpen) return '';
    const draft = drafts.get(item.key) || {summary:item.report,files:[]}; drafts.set(item.key,draft);
    return `<section class="card" id="report-editor"><h2>Préparer le compte rendu</h2><p class="muted small" style="margin:8px 0 18px">Ajoutez le résultat dans ce dossier. Aucune tâche supplémentaire n’est nécessaire.</p><form id="report-form"><label class="field" for="summary">Qu’avez-vous réalisé ?<textarea id="summary" name="summary" required minlength="20" maxlength="4000">${esc(draft.summary)}</textarea><span class="help">Décrivez le résultat en au moins 20 caractères.</span></label><label class="field" for="proof-input">Justificatifs du résultat<input id="proof-input" type="file" multiple accept="image/*,.pdf"><span class="help">Dans cette maquette, seul le nom est lu. Aucun fichier n’est envoyé.</span></label><button class="text" type="button" id="example-proof">Utiliser une photo d’exemple</button><div id="draft-files" class="small muted">${draft.files.map((file) => esc(file.name)).join('<br>')}</div><p id="report-error" role="alert" class="error"></p><div class="row"><button type="submit">Enregistrer le compte rendu</button><button type="button" class="text" id="close-report">Revenir au dossier</button></div></form></section>`;
  }
  function casePage(item) {
    const action = next(item);
    const isReview = role === 'client' && item.state === 'completed' && item.kind !== 'property_task';
    const actionMarkup = `<section class="action" aria-labelledby="action-title"><p class="eyebrow">${action.needed ? 'Votre prochaine action' : 'Le suivi de votre demande'}</p><h2 id="action-title">${isReview ? 'Confirmez le résultat après vérification' : esc(action.label)}</h2><p class="muted">${esc(action.reason)}</p>${action.needed ? `<button type="button" class="primary" id="case-action">${isReview ? 'Confirmer le résultat' : esc(action.label)}</button>` : ''}${isReview ? '<button type="button" class="text" style="margin-left:16px" data-modal="help">Signaler un problème</button>' : ''}</section>`;
    return `<button type="button" class="text back" data-view="center">← Retour au centre</button><div class="page-head"><div><div class="row"><span class="eyebrow">${item.ref} · ${typeLabel(item)}</span><span class="pill ${item.state === 'validated' ? 'good' : ''}">${esc(stateLabel(item))}</span></div><h1 class="case-title">${esc(item.title)}</h1><p class="muted">${esc(item.location)}</p></div></div><div class="detail-grid"><div class="stack">${item.kind === 'property_task' ? '<p class="context-tag">Maison familiale · Intervention liée au bien, sans service créé</p>' : ''}${isReview ? resultMarkup(item)+actionMarkup : actionMarkup+resultMarkup(item)}${reportForm(item)}${stepsMarkup(item)}${!item.steps.length && !organized.has(item.key) && item.kind === 'service' && ['client','admin'].includes(role) ? '<button type="button" class="text" id="organize">Organiser la réalisation en étapes</button>' : ''}${item.kind === 'property_task' && role === 'agent' && item.state === 'in_progress' ? '<button type="button" id="intervention-proof">Ajouter un justificatif au relevé</button>' : ''}${role === 'agent' && item.kind === 'service' && item.steps.length && item.state === 'in_progress' ? `<div><button class="text" type="button" id="prepare-result">Préparer le résultat du service</button><p class="help">La remise du service reste distincte de la clôture des étapes.</p></div>` : ''}${item.kind === 'taxi' ? '<section class="card" id="transport"><h2>Course en cours</h2><p class="muted" style="margin-top:12px">Départ confirmé avec le code du client.</p><p class="small muted" style="margin-top:12px">Le suivi de position, les outils de sécurité et la confirmation d’arrivée conservent leur place dans ce dossier.</p><button type="button" data-modal="transport" style="margin-top:14px">Voir le parcours de transport</button></section>' : ''}${item.kind === 'order' ? '<section class="card" id="order-tools"><h2>Préparation de la commande</h2><p class="muted small" style="margin-top:10px">Les articles, le justificatif de remise et les actions d’expédition restent spécifiques à la commande.</p><button type="button" data-modal="order" style="margin-top:14px">Voir les actions de commande</button></section>' : ''}<details class="card"><summary>Historique du dossier</summary><div class="inside"><ol class="timeline">${item.events.map((event,index) => `<li>${esc(event)}<time>${index === 0 ? 'Dernière évolution' : 'Étape précédente'}</time></li>`).join('')}</ol></div></details><details class="card"><summary>Besoin d’aide ?</summary><div class="inside"><p class="muted small">Un problème avec le résultat ou une question sur la demande ?</p><button type="button" data-modal="help" style="margin-top:12px">Contacter l’équipe</button></div></details></div><aside class="case-aside stack"><section class="card"><h2 style="font-size:16px;margin-bottom:18px">Les personnes</h2><dl class="meta-list"><div><dt>${item.kind === 'taxi' ? 'Chauffeur' : 'Intervenante'}</dt><dd>${esc(item.agent)}</dd></div><div><dt>Responsable du suivi</dt><dd>${esc(item.owner)}</dd></div><div><dt>Demandeuse</dt><dd>Aminata Koné</dd></div></dl></section><details class="card"><summary>Détails et montants</summary><div class="inside"><p class="muted small">${esc(item.category)}</p><p style="font-weight:700;margin-top:8px">${esc(item.amount)}</p><p class="help">Les frais et leurs reçus restent liés à leur service ou étape d’origine.</p><button type="button" class="text" data-modal="finance">Consulter les mouvements</button></div></details></aside></div>`;
  }
  function manage() { return '<div class="page-head"><div><p class="eyebrow">Espace responsable</p><h1>Gestion</h1><p class="muted">Les outils d’administration, regroupés à part du travail quotidien.</p></div></div><div class="directory">'+[['Équipe','Agents, prestataires et affectations'],['Catalogue','Services proposés, métiers et produits'],['Territoires','Pays, régions et organisation locale'],['Finances','Transactions et synthèses'],['Litiges','Problèmes à examiner'],['Configuration','Paramètres et préparation du territoire']].map(([name,hint])=>`<button type="button" data-directory="${esc(name)}">${esc(name)}<span>${esc(hint)}</span></button>`).join('')+'</div>'; }
  function render(focus = false) {
    nav(); $('#main').innerHTML = (message ? `<div class="notice">${esc(message)}</div>` : '') + (view === 'case' ? casePage(cases.find((item) => item.key === selected)) : view === 'manage' ? manage() : center());
    if (focus) { $('#main').focus({preventScroll:true}); window.scrollTo(0,0); }
  }
  function openCase(key, markRead = false) { if (!cases.some((item) => item.key === key && canSee(item))) return; if (markRead) readMessages.add(key); selected = key; view = 'case'; reportOpen = false; message = ''; render(true); }
  function announce(text) { message = text; $('#announcement').textContent = text; render(); }
  function modal(title,html) { $('#dialog-title').textContent = title; $('#dialog-body').innerHTML = html; $('#dialog').showModal(); }
  function showModal(key) {
    const contents = {
      account:['Mon compte',`<p>Retrouvez ici le profil, la sécurité, l’assistance et les accès secondaires.</p><div class="row" style="margin-top:18px">${role === 'client' ? '<button type="button" id="show-properties">Mes biens</button>' : ''}<button type="button" data-modal="finance">Mes mouvements</button></div><p class="lower-note">Maquette : ces réglages ne modifient aucun compte.</p>`],
      new:['Nouvelle demande','<p>Le parcours de création guidé existant reste le point d’entrée pour demander un service, une course ou une livraison.</p><p class="lower-note">Cette étude porte sur le suivi et la réalisation ; elle ne remplace pas ce formulaire.</p>'],
      availability:['Ma disponibilité','<p>La disponibilité et la capacité restent personnelles. Elles prennent place ici, au plus près du travail à réaliser.</p><p class="lower-note">Aucune disponibilité réelle n’est modifiée dans la maquette.</p>'],
      help:['Parler à l’équipe','<p>L’assistance s’ouvre avec la référence du dossier déjà renseignée. Le signalement d’un problème conserve le parcours de litige prévu pour cette demande.</p><p class="lower-note">Aucun message n’est envoyé depuis cette maquette.</p>'],
      finance:['Montants et mouvements','<p>Les dépenses, reçus et paiements restent consultables depuis le dossier. Le récapitulatif ne compte qu’une fois chaque transaction, même si elle concerne une étape.</p><p class="lower-note">Aucune écriture financière n’est créée par cette simulation.</p>'],
      transport:['Variante transport','<p>Carte, code de départ, sécurité et confirmation d’arrivée restent les outils spécifiques du transport. Leur intégration utilise le cadre du dossier, en conservant leurs règles.</p><p class="lower-note">Les transitions de transport ne sont pas simulées dans cette étude.</p>'],
      order:['Variante commande','<p>Préparer, expédier et confirmer la remise gardent leurs contrôles. Articles, documents et résultat se trouvent dans le dossier de commande.</p><p class="lower-note">Le travail complet de ces écrans sera détaillé dans leur lot de refonte.</p>']
    }; const content = contents[key]; if(content) modal(...content);
  }
  document.addEventListener('click',(event) => {
    const button = event.target.closest('button'); if (!button) return;
    if (button.classList.contains('close')) return $('#dialog').close();
    if (button.dataset.view) { view=button.dataset.view; query=''; family='all'; message=''; render(true); return; }
    if (button.dataset.tab) { tab=button.dataset.tab; message=''; render(); return; }
    if (button.dataset.open) return openCase(button.dataset.open);
    if (button.dataset.infoOpen) return openCase(button.dataset.infoOpen,true);
    if (button.dataset.read) { readMessages.add(button.dataset.read); render(); return; }
    if (button.dataset.preview) return modal(button.dataset.preview,`<div class="preview-paper"><strong>${esc(button.dataset.preview)}</strong><p class="muted small">Exemple de document du dossier</p></div><p class="small muted">Aperçu fictif. Dans l’application, la pièce d’origine s’ouvre ici.</p>`);
    if (button.dataset.modal) { if ($('#dialog').open) $('#dialog').close(); showModal(button.dataset.modal); return; }
    if (button.dataset.directory) return modal(button.dataset.directory,'<p>Ce groupe rassemble les outils existants selon les droits du responsable.</p><p class="lower-note">La refonte détaillée de ce groupe est prévue après le dossier et le centre communs.</p>');
    if (button.id === 'account') return showModal('account');
    if (button.id === 'show-properties') { $('#dialog').close(); modal('Mes biens','<p>Maison familiale · Bamako</p><p class="small muted" style="margin-top:10px">Les biens restent des ressources durables. Leurs interventions sont accessibles sans créer de faux service.</p><button type="button" id="property-intervention" style="margin-top:15px">Ouvrir le relevé du compteur</button>'); return; }
    const item = cases.find((entry) => entry.key === selected);
    if (button.id === 'property-intervention') { $('#dialog').close(); return openCase('property_task:311'); }
    if (button.id === 'reset') { cases=seed(); cases[0].state='in_progress'; cases[0].report=''; cases[0].proofs=[]; drafts.clear(); openSections.clear(); organized.clear(); role='agent'; $('#role').value=role; view='center'; tab='action'; query=''; family='all'; reportOpen=false; message='Simulation réinitialisée. Ouvrez la visite pour préparer son résultat, puis passez au rôle client après sa remise.'; render(true); return; }
    if (!item) return;
    if (button.id === 'organize') { organized.add(item.key); openSections.add(`${role}:${item.key}`); render(); $('#steps').scrollIntoView({behavior:'smooth',block:'start'}); return; }
    if (button.id === 'intervention-proof') { item.proofs.push({id:`task-proof:${++serial}`,name:'Photo-compteur-exemple.jpg',kind:'photo',use:'Justificatif de l’intervention'}); return announce('Exemple ajouté à l’intervention sur le bien. Aucun service n’a été créé.'); }
    if (button.id === 'prepare-result') { reportOpen=true; render(); $('#report-editor').scrollIntoView({behavior:'smooth',block:'start'}); return; }
    if (button.id === 'case-action') {
      const action=next(item).action;
      if(action === 'review') { item.state='validated'; item.events.unshift('Résultat confirmé par Aminata'); return announce('Vous avez confirmé le résultat. Le dossier et ses documents restent disponibles.'); }
      if(action === 'report') { reportOpen=true; render(); $('#report-editor').scrollIntoView({behavior:'smooth',block:'start'}); return; }
      if(action === 'handover') { if (item.kind === 'project' && item.steps.some((step) => !['completed','validated'].includes(step.state))) return announce('Les phases du projet doivent être terminées avant sa remise.'); item.state='completed'; item.events.unshift('Résultat remis par Awa'); return announce('Résultat remis. La confirmation du client est maintenant attendue.'); }
      if(action === 'steps') { $('#steps').open=true; $('#steps').scrollIntoView({behavior:'smooth',block:'start'}); return; }
      if(action === 'transport') { $('#transport').scrollIntoView({behavior:'smooth',block:'start'}); return; }
      if(action === 'order') { $('#order-tools').scrollIntoView({behavior:'smooth',block:'start'}); return; }
      if(['start-task','finish-task','validate-task'].includes(action)) { item.state={ 'start-task':'in_progress','finish-task':'completed','validate-task':'validated'}[action]; item.events.unshift(action === 'validate-task' ? 'Intervention contrôlée par Moussa' : action === 'finish-task' ? 'Relevé terminé par Awa' : 'Relevé commencé par Awa'); return announce(action === 'finish-task' ? 'Relevé terminé. Le contrôle du responsable reste attendu.' : 'Intervention mise à jour dans ce dossier.'); }
    }
    if (button.dataset.stepAction) {
      const step=item.steps.find((entry) => String(entry.id) === button.dataset.stepAction); if (!step) return;
      step.state=role === 'admin' ? 'validated' : step.state === 'created' ? 'in_progress' : 'completed'; item.events.unshift(`${step.state === 'validated' ? 'Étape contrôlée' : step.state === 'completed' ? 'Étape réalisée' : 'Étape commencée'} : ${step.title}`);
      return announce('Étape mise à jour. Le résultat du dossier conserve son propre parcours de remise et de confirmation.');
    }
    if (button.dataset.stepAssign && role === 'admin') { const step=item.steps.find((entry) => String(entry.id) === button.dataset.stepAssign); step.assigned=true; return announce('Étape affectée à Awa dans cette simulation.'); }
    if (button.dataset.stepProof) { const step=item.steps.find((entry) => String(entry.id) === button.dataset.stepProof); step.proofs.push('Justificatif-etape-exemple.jpg'); return announce('Exemple ajouté à cette étape. Il ne remplace pas les justificatifs du résultat final.'); }
    if (button.id === 'close-report') { reportOpen=false; render(); return; }
    if (button.id === 'example-proof') { const draft=drafts.get(item.key); if (draft.files.length < 3) draft.files.push({name:'Photo-resultat-exemple.jpg',kind:'photo'}); else $('#report-error').textContent='Trois fichiers maximum par envoi.'; $('#draft-files').textContent=draft.files.map((file)=>file.name).join(' · '); }
  });
  document.addEventListener('input',(event) => {
    if(event.target.id === 'summary') drafts.get(selected).summary=event.target.value;
    if(event.target.id === 'search') { const position=event.target.selectionStart; query=event.target.value; const host=document.createElement('div'); host.innerHTML=queueBody(); $('#queue-items').innerHTML=host.querySelector('#queue-items').innerHTML; event.target.setSelectionRange(position,position); }
  });
  document.addEventListener('toggle',(event) => { if(event.target.id === 'steps') { const key=event.target.dataset.scope; if(event.target.open) openSections.add(key); else openSections.delete(key); } },true);
  document.addEventListener('change',(event) => {
    if(event.target.id === 'role') { role=event.target.value; view='center'; selected=null; reportOpen=false; query=''; family='all'; tab='action'; message=''; if ($('#dialog').open) $('#dialog').close(); render(true); }
    if(event.target.id === 'family') { family=event.target.value; render(); }
    if(event.target.id === 'proof-input') { const files=Array.from(event.target.files); const draft=drafts.get(selected); if(files.length+draft.files.length>3) { $('#report-error').textContent='Trois fichiers maximum par envoi.'; event.target.value=''; return; } draft.files.push(...files.map((file)=>({name:file.name,kind:file.type.startsWith('image/')?'photo':'document'}))); $('#draft-files').textContent=draft.files.map((file)=>file.name).join(' · '); }
  });
  document.addEventListener('submit',(event) => {
    if (!['report-form','step-form'].includes(event.target.id)) return; event.preventDefault(); const item=cases.find((entry)=>entry.key === selected);
    if(event.target.id === 'step-form') { const title=new FormData(event.target).get('title').trim(); if(!title || !['admin','client'].includes(role)) return; item.steps.push({id:++serial,title,state:'created',proofs:[],assigned:false}); item.events.unshift('Étape ajoutée : '+title); announce('Étape ajoutée au dossier. Son affectation reste à organiser par le responsable.'); return; }
    const draft=drafts.get(item.key); if(draft.summary.trim().length<20 || !draft.files.length && !item.proofs.length) { $('#report-error').textContent='Décrivez le résultat et ajoutez un justificatif pour cet exemple de service.'; return; }
    if(item.proofs.length+draft.files.length>15) { $('#report-error').textContent='Ce compte rendu a atteint sa limite de quinze justificatifs.'; return; }
    item.report=draft.summary.trim(); item.proofs.push(...draft.files.map((file)=>({...file,id:`service-proof:${++serial}`,use:'Résultat du service'}))); drafts.delete(item.key); reportOpen=false; item.events.unshift('Compte rendu enregistré par Awa'); announce('Compte rendu enregistré dans le dossier. Le résultat n’est pas encore remis au client.');
  });
  render();
</script>
</body>
</html>
