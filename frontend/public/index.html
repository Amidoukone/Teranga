<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <!-- ======================================= -->
    <!-- 📱 RESPONSIVE                            -->
    <!-- ======================================= -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ======================================= -->
    <!-- 🎨 COULEUR NAVIGATEUR / PWA             -->
    <!-- ======================================= -->
    <meta name="theme-color" content="#0ea5e9" />

    <!-- ======================================= -->
    <!-- 🔥 ICONES (Favicons + Apple + Android)   -->
    <!-- ======================================= -->

    <!-- Favicon standard -->
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/logo_16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/logo_32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%PUBLIC_URL%/logo_48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/logo_64x64.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Apple Touch Icon (iOS / iPadOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo_180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/logo_192x192.png" />

    <!-- Manifest (PWA) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ======================================= -->
    <!-- 🔍 SEO — TITRE + DESCRIPTION + KEYWORDS -->
    <!-- ======================================= -->
    <title>Teranga – Plateforme pour la diaspora africaine</title>

    <meta
      name="description"
      content="Teranga — Plateforme fiable qui connecte la diaspora africaine à ses biens, projets et services au pays. Transparence, preuves, agents certifiés et suivi en temps réel."
    />

    <meta
      name="keywords"
      content="diaspora africaine, Mali, Afrique, gestion de biens, services diaspora, suivi projets, Teranga, agents locaux, immobilier diaspora, assistance au pays, preuves, suivi en temps réel"
    />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://teranga-diaspora.com/" />

    <!-- ======================================= -->
    <!-- 🟦 OPEN GRAPH — FACEBOOK / WHATSAPP      -->
    <!-- ======================================= -->
    <meta property="og:title" content="Teranga — Diaspora & Services au pays" />
    <meta
      property="og:description"
      content="Gérez vos biens, projets et services à distance en toute transparence. Preuves, photos, vidéos, transactions claires et agents certifiés."
    />
    <meta property="og:image" content="https://teranga-diaspora.com/logo_512x512.png" />
    <meta property="og:url" content="https://teranga-diaspora.com" />
    <meta property="og:type" content="website" />

    <!-- ======================================= -->
    <!-- 🐦 TWITTER CARDS                         -->
    <!-- ======================================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Teranga — Diaspora & Services" />
    <meta
      name="twitter:description"
      content="Plateforme moderne dédiée à la diaspora africaine."
    />
    <meta name="twitter:image" content="https://teranga-diaspora.com/logo_512x512.png" />

    <!-- ======================================= -->
    <!-- 📊 SCHEMA.ORG — GOOGLE RICH RESULTS     -->
    <!-- ======================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Teranga",
        "url": "https://teranga-diaspora.com",
        "logo": "https://teranga-diaspora.com/logo_512x512.png",
        "description": "Plateforme moderne connectant la diaspora africaine à ses biens, projets et services.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bamako",
          "addressCountry": "Mali"
        }
      }
    </script>

    <!-- ======================================= -->
    <!-- 📈 GOOGLE ANALYTICS 4                   -->
    <!-- Chargé dynamiquement après consentement -->
    <!-- ======================================= -->

  </head>

  <body>
    <noscript>Veuillez activer JavaScript pour utiliser l'application Teranga.</noscript>
    <div id="root"></div>
  </body>
</html>
